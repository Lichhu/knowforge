# Local development database only. Production credentials and deployment are environment-managed.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: knowforge
      POSTGRES_USER: knowforge
      POSTGRES_PASSWORD: knowforge
    ports:
      - "5432:5432"
    volumes:
      - knowforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowforge -d knowforge"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  knowforge-postgres:
